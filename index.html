.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{padding:10px}.card img{width:100%;height:120px;object-fit:contain;background:var(--in);border-radius:12px}.card .ph{height:120px;display:grid;place-items:center;font-size:2.6rem;background:var(--in);border-radius:12px}.card .r{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.card .nt{font-size:.78rem;background:var(--in);border-radius:8px;padding:4px 8px;margin-top:4px}

/* ===== HUMAM IT Metallic Dark Theme (logo-matched) ===== */
:root{
  --ink:#e8eaed;
  --mute:#9aa3ad;
  --acc:#7eb8ff;
  --acc2:#5a9fd4;
  --accink:#0a0e14;
  --gold:#c8ccd4;
  --gl:rgba(18,22,30,.92);
  --gb:rgba(255,255,255,.09);
  --in:#141a22;
  --bg1:#080b10;
  --bg2:#0e131a;
  --bg3:#121820;
  --sh:0 16px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  --navy:linear-gradient(145deg,#1c2430 0%,#0a0e14 100%);
  --metal:linear-gradient(145deg,#d0d4dc 0%,#8a909c 45%,#c0c4cc 100%);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:#12151a;
  --mute:#5a6570;
  --acc:#2a6fad;
  --acc2:#1a5a8a;
  --accink:#fff;
  --gold:#6a7080;
  --gl:#ffffff;
  --gb:rgba(0,0,0,.08);
  --in:#eef1f5;
  --bg1:#f0f2f5;
  --bg2:#e4e8ee;
  --bg3:#f7f8fa;
  --sh:0 14px 34px rgba(30,40,60,.12),0 2px 6px rgba(30,40,60,.06);
  --navy:linear-gradient(145deg,#1c2a3a 0%,#0d1520 100%);
  --metal:linear-gradient(145deg,#e8ecf2 0%,#b0b6c0 45%,#d8dce4 100%);
  color-scheme:light;
}
html::before{
  background:
    radial-gradient(ellipse 70% 45% at 15% 10%,rgba(90,140,200,.12),transparent 55%),
    radial-gradient(ellipse 60% 40% at 90% 20%,rgba(140,160,190,.08),transparent 50%),
    radial-gradient(ellipse 80% 50% at 50% 100%,rgba(40,60,90,.18),transparent 60%);
  filter:blur(20px);
}
:root[data-theme="light"] html::before{
  background:
    radial-gradient(ellipse 70% 40% at 20% 10%,rgba(255,255,255,.9),transparent 55%),
    radial-gradient(ellipse 60% 35% at 90% 30%,rgba(180,200,230,.35),transparent 55%);
}
.glass{
  background:var(--gl);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--gb);
  box-shadow:var(--sh);
  border-radius:24px;
}
#top{border-radius:20px;padding:10px 14px;background:var(--gl)}
#top h1{background:none;color:var(--ink);-webkit-text-fill-color:var(--ink);font-weight:700}
.ib{border-radius:50%;background:var(--in);border:1px solid var(--gb);box-shadow:var(--sh);width:42px;height:42px;color:var(--ink)}
#rail{
  border-radius:28px 28px 24px 24px;
  background:linear-gradient(180deg,#121820,#0a0e14);
  border:1px solid var(--gb);
  box-shadow:0 -8px 32px rgba(0,0,0,.45);
  padding:10px 8px 8px;
}
:root[data-theme="light"] #rail{
  background:linear-gradient(180deg,#f4f6f9,#e4e8ee);
}
#rail button{color:var(--mute);border-radius:16px}
#rail button.on{background:transparent;color:var(--acc);font-weight:700}
#rail button.on b{transform:translateY(-1px)}
#rail .fab{
  background:var(--navy);
  color:#fff;
  box-shadow:0 0 0 5px rgba(126,184,255,.15),0 12px 28px rgba(0,0,0,.5);
  width:62px;height:62px;flex-basis:62px;margin-top:-34px;
}
:root[data-theme="light"] #rail .fab{
  box-shadow:0 0 0 5px rgba(42,111,173,.12),0 12px 24px rgba(0,0,0,.2);
}
.hero{
  background:var(--navy);
  color:#fff;
  border:0;
  border-radius:28px;
  position:relative;
  overflow:hidden;
  box-shadow:0 20px 48px rgba(0,0,0,.5);
  text-align:center;
  padding:28px 20px 32px;
}
.hero::after{
  content:"";
  position:absolute;
  inset-inline-end:-50px;top:-50px;
  width:180px;height:180px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(126,184,255,.18),transparent 70%);
  pointer-events:none;
}
.hero h2,.hero p{color:#fff;position:relative}
.hero p{opacity:.75}
.hero .badge{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.hero .b{background:#fff;color:#0a0e14}
.hero .b.o{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.hero-logo{
  width:110px;height:110px;
  border-radius:28px;
  object-fit:contain;
  display:block;
  margin:0 auto 14px;
  box-shadow:
    0 0 0 4px rgba(200,210,220,.12),
    0 12px 32px rgba(0,0,0,.55),
    0 0 40px rgba(126,184,255,.15);
  background:radial-gradient(circle at 40% 35%,#1a2030,#080b10 70%);
  padding:6px;
}
.stats .glass{border-radius:20px;padding:12px 6px}
.stats b{color:var(--acc);font-weight:700}
.sh{font-weight:700;font-size:1.1rem}
.cat{border-radius:24px;padding:18px 8px}
.cat .e{
  display:grid;place-items:center;
  width:58px;height:58px;margin:0 auto 8px;
  border-radius:50%;
  font-size:1.7rem;
  background:linear-gradient(145deg,#1e2632,#0e131a);
  box-shadow:6px 8px 16px rgba(0,0,0,.4),-3px -3px 8px rgba(255,255,255,.03);
}
:root[data-theme="light"] .cat .e{
  background:linear-gradient(145deg,#fff,#dce3ec);
  box-shadow:6px 8px 16px rgba(60,80,110,.12),-4px -4px 10px #fff;
}
.cat em{background:#e5484d;color:#fff;font-weight:600}
.rec img,.card img,.card .ph{background:var(--in);border:1px solid var(--gb);box-shadow:var(--sh);border-radius:16px}
.b,.btn{
  background:var(--navy);
  color:#fff;
  border-radius:14px;
  box-shadow:0 8px 18px rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.06);
}
.b.o,.btn.alt{
  background:var(--in);
  color:var(--ink);
  border:1px solid var(--gb);
  box-shadow:var(--sh);
}
.c{background:var(--in);border:0;border-radius:20px;padding:7px 14px;color:var(--mute)}
.c.on,.tabs2 button.on{
  background:var(--navy);
  color:#fff;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}
.c:not(.on):first-child{background:rgba(126,184,255,.1);color:var(--acc)}
.tabs2{border-radius:20px}
.tabs2 button{color:var(--mute)}
.f input,.f select,.f textarea,.search,.fld input{
  border:0;border-radius:14px;
  background:var(--in);
  box-shadow:inset 2px 2px 6px rgba(0,0,0,.35);
  padding:10px 12px;
  color:var(--ink);
}
:root[data-theme="light"] .f input,
:root[data-theme="light"] .f select,
:root[data-theme="light"] .f textarea,
:root[data-theme="light"] .search,
:root[data-theme="light"] .fld input{
  box-shadow:inset 3px 3px 7px rgba(60,80,110,.1),inset -3px -3px 7px #fff;
}
.t{background:var(--in);border:0;border-radius:18px;box-shadow:var(--sh)}
.ly.on{background:rgba(126,184,255,.12);border-color:transparent}
.pn{border-radius:22px}
.card{border-radius:22px}
.mod{background:rgba(4,8,14,.65);backdrop-filter:blur(8px)}
.mod>div{border-radius:26px}
.sl input,.sl2 input{accent-color:var(--acc)}
#pc{border-radius:12px}
#toast span{background:var(--navy);color:#fff}
.logo{
  width:46px;height:46px;
  border-radius:12px;
  background:radial-gradient(circle at 40% 35%,#1a2030,#080b10 70%);
  object-fit:contain;
  box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 2px rgba(200,210,220,.1);
  flex:none;
  padding:3px;
}


/* Logo prominence */
.hero-logo{transition:transform .25s ease}
.hero-logo:hover{transform:scale(1.04)}

}

#rail .brand img{
  width:56px !important;height:56px !important;
  border-radius:14px;

}

/* ===== usability ===== */
html{font-size:17px}html,body{overflow-x:hidden}
.logo{width:42px;height:42px;border-radius:12px;background:transparent;display:block;object-fit:contain;box-shadow:0 6px 14px rgba(6,48,74,.3);flex:none}
#top h1{display:flex;flex-direction:column;line-height:1.15;font-size:1.15rem;letter-spacing:.3px}
#top h1 small{font-size:.78rem;font-weight:500;color:var(--mute)}
.ib{flex:none}#top{gap:6px;padding:8px 10px;overflow:hidden}#top h1{flex:1 1 0;min-width:0}#top h1 span{white-space:nowrap;font-size:1rem;overflow:hidden;text-overflow:ellipsis}#top .ib{width:38px;height:38px;font-size:1rem}.logo{width:42px;height:42px;border-radius:12px}

.c{padding:10px 16px;font-size:.95rem}

 body{padding-bottom:24px}

/* ===== Unified Login Gate — Luxury · iPhone-fixed ===== */
#login-gate{
  position:fixed;
  top:0;right:0;bottom:0;left:0;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  max-width:100vw;
  height:100%;
  height:100dvh;
  min-height:-webkit-fill-available;
  padding:
    max(12px, env(safe-area-inset-top, 0px))
    max(14px, env(safe-area-inset-right, 0px))
    max(12px, env(safe-area-inset-bottom, 0px))
    max(14px, env(safe-area-inset-left, 0px));
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:none;
  background:#02040a;
  isolation:isolate;
  box-sizing:border-box;
  touch-action:pan-y;
}
#login-gate.hidden{
  opacity:0;pointer-events:none;
  transition:opacity .55s cubic-bezier(.22,1,.36,1);
}
#login-gate .lg-bg{
  position:absolute;
  top:0;right:0;bottom:0;left:0;
  z-index:0;pointer-events:none;
  overflow:hidden;
  background:
    radial-gradient(ellipse 120% 80% at 50% -25%, rgba(180,200,230,.14), transparent 50%),
    radial-gradient(ellipse 70% 55% at 50% 20%, rgba(126,184,255,.12), transparent 55%),
    radial-gradient(ellipse 50% 40% at 100% 80%, rgba(160,170,190,.06), transparent 50%),
    radial-gradient(ellipse 40% 35% at 0% 60%, rgba(100,140,190,.07), transparent 50%),
    linear-gradient(185deg, #03050c 0%, #080b14 45%, #05070e 100%);
}
#login-gate .lg-bg::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 22%, rgba(200,210,230,.08) 0%, transparent 38%);
  animation:lgPulseBg 9s ease-in-out infinite;
}
@keyframes lgPulseBg{
  0%,100%{opacity:.6}
  50%{opacity:1}
}
#login-gate .lg-bg::after{
  content:"";position:absolute;inset:0;opacity:.28;
  background-image:
    linear-gradient(rgba(200,210,230,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,210,230,.03) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 10%,transparent 70%);
}
/* Orbs clipped — no horizontal overflow on iPhone */
.lg-orb{
  position:absolute;border-radius:50%;filter:blur(64px);
  pointer-events:none;z-index:0;opacity:.5;
  animation:lgOrb 16s ease-in-out infinite;
  max-width:80vw;max-height:50vh;
}
.lg-orb.o1{
  width:min(320px, 85vw);height:min(320px, 50vh);
  top:-8%;left:50%;
  background:radial-gradient(circle, rgba(180,200,230,.32) 0%, rgba(126,184,255,.18) 40%, transparent 68%);
  animation-name:lgOrbHero;
}
.lg-orb.o2{
  width:min(180px, 45vw);height:min(180px, 30vh);
  bottom:0;right:0;
  background:radial-gradient(circle, rgba(140,160,190,.2), transparent 70%);
  animation-duration:20s;animation-delay:-5s;
}
.lg-orb.o3{
  width:min(140px, 40vw);height:min(140px, 25vh);
  bottom:15%;left:0;
  background:radial-gradient(circle, rgba(160,180,210,.14), transparent 70%);
  animation-duration:14s;animation-delay:-8s;
}
@keyframes lgOrb{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(8px,-10px) scale(1.05)}
}
@keyframes lgOrbHero{
  0%,100%{transform:translateX(-50%) scale(1);opacity:.45}
  50%{transform:translateX(-50%) translateY(10px) scale(1.06);opacity:.7}
}

.lg-wrap{
  position:relative;z-index:2;
  width:100%;
  max-width:min(400px, 100%);
  margin:0 auto;
  display:flex;flex-direction:column;align-items:center;
  box-sizing:border-box;
  flex-shrink:0;
}

.lg-status{
  width:100%;
  max-width:100%;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;padding:0 2px;
  animation:lgFade .7s cubic-bezier(.22,1,.36,1) both;
  box-sizing:border-box;
  gap:8px;
}
.lg-status .live{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 11px;border-radius:999px;
  background:linear-gradient(135deg, rgba(200,210,230,.1), rgba(126,184,255,.06));
  border:1px solid rgba(200,210,230,.2);
  color:#c8d4e4;font-weight:700;font-size:.62rem;

.lg-status .dot{
  width:6px;height:6px;border-radius:50%;flex:none;
  background:linear-gradient(135deg, #c8d4e4, #7eb8ff);
  box-shadow:0 0 8px rgba(180,200,230,.5);
  animation:lgPing 2.2s ease infinite;

.lg-status > div:last-child{

@keyframes lgPing{
  0%{box-shadow:0 0 0 0 rgba(180,200,230,.45)}

.lg-logo-wrap{
  margin-bottom:16px;

  animation:lgLogoIn 1s cubic-bezier(.22,1,.36,1) .08s both;

}
.lg-logo-wrap::before{
  content:"";

  border-radius:50%;
  background:radial-gradient(circle, rgba(200,210,230,.22) 0%, rgba(126,184,255,.1) 40%, transparent 68%);

  z-index:-1;
  pointer-events:none;

.lg-logo-wrap::after{
  content:"";

  border-radius:42px;
  border:1px solid rgba(200,210,230,.16);
  pointer-events:none;opacity:.75;
}
@keyframes lgGlow{
  0%,100%{opacity:.4;transform:scale(.96)}
  50%{opacity:.85;transform:scale(1.04)}
}
@keyframes lgLogoIn{
  from{opacity:0;transform:translateY(20px) scale(.9)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.lg-logo{
  width:min(148px, 38vw);

.lg-logo:hover{

@keyframes lgFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* ---------- OCR (Tesseract.js) — Arabic names & numbers only ---------- */
let OCR_WORKER=null, OCR_BUSY=false;
async function getOcrWorker(){
  if(OCR_WORKER) return OCR_WORKER;
  if(typeof Tesseract==="undefined") throw new Error(tr("محرك OCR غير محمّل. تحقق من الاتصال","OCR engine not loaded. Check connection"));
  toast("⏳ "+tr("تحميل محرك OCR العربي...","Loading Arabic OCR engine..."));
  OCR_WORKER = await Tesseract.createWorker(["ara","eng"], 1, {
    logger: m => {
      if(m.status==="loading language traineddata") toast("⏳ "+tr("تحميل لغة عربية...","Loading Arabic language..."));
      else if(m.status==="initializing api") toast("⏳ "+tr("تهيئة OCR...","Initializing OCR..."));
      else if(m.status==="recognizing text") toast("⏳ OCR "+Math.round((m.progress||0)*100)+"%");
    }
  });
  // Iraqi ID-oriented defaults
  await OCR_WORKER.setParameters({
    tessedit_pageseg_mode: "6",
    preserve_interword_spaces: "1",
    tessedit_char_blacklist: "|[]{}<>«»•◆◇○●■□▪▫~`^*_={}",
    user_defined_dpi: "300"
  });
  return OCR_WORKER;
}
/** Stronger contrast + mild upscale for small Arabic text on cards */
function prepareOcrCanvas(srcCanvas){
  const scale=Math.max(1, Math.min(2.2, 1400/Math.max(srcCanvas.width, srcCanvas.height)));
  const W=Math.round(srcCanvas.width*scale), H=Math.round(srcCanvas.height*scale);
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
  x.drawImage(srcCanvas,0,0,W,H);
  const id=x.getImageData(0,0,W,H), d=id.data;
  const hist=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4){
    const y=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    d[i]=d[i+1]=d[i+2]=y; hist[y|0]++;
  }
  let sum=0, total=W*H, lo=0, hi=255;
  for(let i=0;i<256;i++){ sum+=hist[i]; if(sum>total*0.02){ lo=i; break; } }
  sum=0;
  for(let i=255;i>=0;i--){ sum+=hist[i]; if(sum>total*0.02){ hi=i; break; } }
  const span=Math.max(40, hi-lo);
  for(let i=0;i<d.length;i+=4){
    let y=((d[i]-lo)/span)*255;
    if(y<0)y=0; if(y>255)y=255;
    if(y>200)y=255; else if(y<70)y=0;
    d[i]=d[i+1]=d[i+2]=y;
  }
  x.putImageData(id,0,0); return c;
}
function ocrImageFor(it){
  const ppm=Math.min(14,Math.max(10,300/25.4));
  let base;
  try{ base=proc(it,it.w,it.h,ppm); }
  catch(e){
    const S=SRC[it.id]; if(!S) return null;
    base=document.createElement("canvas"); base.width=S.width; base.height=S.height;
    base.getContext("2d").drawImage(S,0,0);
  }
  return prepareOcrCanvas(base);
}
function cleanOcrText(raw){
  if(!raw) return "";
  let t=raw.replace(/\r/g,"")
    .replace(/[ \t]+/g," ")
    .replace(/[|¦«»„“”•◆◇○●■□▪▫]/g,"")
    .replace(/_{2,}/g,"").replace(/-{3,}/g,"")
    .replace(/\n[ \t]+/g,"\n").replace(/[ \t]+\n/g,"\n")
    .replace(/\n{3,}/g,"\n\n").trim();
  const lines=t.split("\n"), kept=[], ar=/[\u0600-\u06FF]/, num=/[0-9\u0660-\u0669]/;
  for(let line of lines){
    line=line.trim();
    if(line.length<2) continue;
    if(!ar.test(line) && !num.test(line)) continue;
    const letters=(line.match(/[\u0600-\u06FFa-zA-Z0-9\u0660-\u0669]/g)||[]).length;
    if(letters < line.length*0.35 && line.length>4) continue;
    kept.push(line);
  }
  return kept.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
async function runOCR(id){
  const it=D.items.find(i=>i.id===id);
  if(!it||!SRC[id]) return toast(tr("أضف صورة أولاً","Add an image first"));
  if(OCR_BUSY) return toast(tr("OCR يعمل حالياً، انتظر...","OCR already running..."));
  OCR_BUSY=true;
  try{
    toast("⏳ "+tr("استخراج دقيق للمستمسكات العراقية...","Accurate Iraqi document extraction..."));
    const c=ocrImageFor(it);
    if(!c) throw new Error("no image");
    const w=await getOcrWorker();
    let input=c;
    try{ input=await new Promise((res,rej)=>{ c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png"); }); }
    catch(e){ try{ input=c.toDataURL("image/png"); }catch(e2){ input=c; } }
    await w.setParameters({tessedit_pageseg_mode:"6"});
    const r1=await w.recognize(input);
    let t2="";
    try{
      await w.setParameters({tessedit_pageseg_mode:"4"});
      const r2=await w.recognize(input);
      t2=r2.data&&r2.data.text||"";
    }catch(e){}
    await w.setParameters({tessedit_pageseg_mode:"6"});
    const t1=r1.data&&r1.data.text||"";
    const seen=new Map();
    for(const block of [t1,t2]){
      for(const ln of cleanOcrText(block).split("\n")){
        const k=ln.replace(/\s+/g," ").trim();
        if(k.length>=2 && !seen.has(k)) seen.set(k,ln);
      }
    }
    const clean=[...seen.values()].join("\n").trim() || cleanOcrText(t1);
    if(!clean){
      toast(tr("لم يُعثر على أسماء أو أرقام واضحة. حسّن القص أو الإضاءة","No clear names/numbers found. Improve crop or lighting"));
      return;
    }
    // Prefer structured review when parse finds fields
    try{
      const p=parse(clean, r1.data&&r1.data.words||[]);
      const has=p.fields.name||p.fields.idno||p.fields.dob||p.fields.ration||p.fields.passport;
      if(has){
        const rec={id:uid(),created:Date.now(),orig:SRC[id].toDataURL("image/jpeg",.9),proc:null,th:null,side:"",type:p.type||it.name,fields:p.fields,raw:clean,conf:p.conf,reviewed:false,person:""};
        // also mirror into studio item notes
        it.ocr=clean; it.fields={fullName:p.fields.name,idNumber:p.fields.idno,dob:p.fields.dob,rationNo:p.fields.ration,passportNo:p.fields.passport,motherName:p.fields.mother};
        reviewRec(rec,true);
        return;
      }
    }catch(e){}
    showOcrPreview(it, clean);
  }catch(e){
    console.error(e);
    toast("OCR ✗: "+((e&&e.message)||String(e)).slice(0,90));
  }finally{ OCR_BUSY=false; }
}

/* ===== HUMAM Pro layer: security, encrypted backup, audit, PWA ===== */
(()=>{
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
const b64=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const enc=new TextEncoder();
/* audit log */
function log(a){const L=LS("mqlog",[]);L.push({t:Date.now(),a});SV("mqlog",L.slice(-300))}
/* PBKDF2 PIN hashing (replaces plain SHA-256); legacy PINs still unlock until re-set */
const legacySha=sha;
async function pb(s,salt,it){const k=await crypto.subtle.importKey("raw",enc.encode(s),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:it},k,256))}
sha=async function(s){if(PIN&&!PIN.startsWith("p2:"))return legacySha(s);let salt=LS("mqsalt",null);if(!salt){salt=hex(crypto.getRandomValues(new Uint8Array(16)));SV("mqsalt",salt)}return "p2:"+await pb(s,unb64h(salt),210000)};
function unb64h(h){return Uint8Array.from(h.match(/../g),x=>parseInt(x,16))}
/* auto-lock timeout + privacy shield */
arm=function(){clearTimeout(lockT);if(PIN)lockT=setTimeout(lockScreen,(LS("mqs",{}).min||5)*60000)};
const pv=document.createElement("div");pv.style.cssText="position:fixed;inset:0;z-index:200;display:none;background:var(--bg1);backdrop-filter:blur(30px);align-items:center;justify-content:center;font-size:3rem";pv.textContent="🔒";document.body.appendChild(pv);
let hid=0;document.addEventListener("visibilitychange",()=>{if(document.hidden){hid=Date.now();pv.style.display="flex"}else{pv.style.display="none";if(PIN&&Date.now()-hid>30000){lockScreen();log("auto-lock (background)")}}});
const _ls=lockScreen;lockScreen=function(){const was=!!$("#lock");_ls();if(!was){log("lock");addBio()}};
/* WebAuthn biometric gate (local convenience gate, not server-verified) */
function addBio(){const c=LS("mqcred",null),d=$("#lock");if(!c||!d||!navigator.credentials)return;const b=document.createElement("button");b.className="btn alt";b.style.cssText="width:100%;margin-top:8px";b.textContent="🧬 "+tr("فتح بالبصمة / Face ID","Unlock with biometrics");b.onclick=async()=>{try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:unb64(c)}],userVerification:"required",timeout:60000}});d.remove();arm();log("unlock (biometric)")}catch(e){toast(tr("فشلت المصادقة","Authentication failed"))}};d.querySelector(".glass").appendChild(b)}
async function regBio(){try{if(!window.PublicKeyCredential||!isSecureContext)return toast(tr("يتطلب HTTPS ومتصفحاً يدعم WebAuthn","Needs HTTPS + WebAuthn support"));const r=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"HUMAM Documents"},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"humam",displayName:"HUMAM"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});SV("mqcred",b64(new Uint8Array(r.rawId)));log("biometric enabled");toast("✓")}catch(e){toast(tr("تعذر التفعيل","Could not enable"))}}
/* encrypted, integrity-checked backups */

/* ===== Login Gate (Humam / Humam) ===== */
(function(){
  const USER="Humam", PASS="Humam";
  const gate=document.getElementById("login-gate");
  const form=document.getElementById("lgForm");
  const btn=document.getElementById("lgBtn");
  const card=document.getElementById("lgCard");
  const y=document.getElementById("lgYear");
  if(y) y.textContent=new Date().getFullYear();

  function lgToast(msg, err){
    const t=document.getElementById("lg-toast");
    const m=document.getElementById("lgToastMsg");
    if(!t||!m) return;
    m.textContent=msg;
    t.classList.toggle("error", !!err);
    t.classList.add("show");
    clearTimeout(lgToast._k);
    lgToast._k=setTimeout(()=>t.classList.remove("show"), 3200);
  }
  function unlock(){
    if(!gate) return;
    gate.classList.add("success");
    setTimeout(function(){
      gate.classList.add("hidden");
      const shell=document.getElementById("shell");
      if(shell) shell.classList.add("ready");
      setTimeout(function(){ try{ gate.remove(); }catch(e){} }, 600);
    }, 260);
  }
  try{
    if(sessionStorage.getItem("humam_logged")==="1"){ unlock(); }
  }catch(e){}

  const tog=document.getElementById("lgToggle");
  if(tog) tog.onclick=function(){
    const i=document.getElementById("lgPass");
    if(i) i.type = i.type==="password" ? "text" : "password";
  };

  if(form) form.addEventListener("submit", function(e){
    e.preventDefault();
    const u=(document.getElementById("lgUser").value||"").trim();
    const p=document.getElementById("lgPass").value||"";
    if(!u||!p){ lgToast("يرجى ملء كافة الحقول", true); return; }
    if(btn){ btn.classList.add("loading"); btn.disabled=true; }
    setTimeout(function(){
      if(u===USER && p===PASS){
        try{
          sessionStorage.setItem("humam_logged","1");
          if(document.getElementById("lgRemember") && document.getElementById("lgRemember").checked)
            localStorage.setItem("humam_login_user", u);
        }catch(err){}
        if(btn){ btn.classList.remove("loading"); btn.disabled=false; }
        lgToast("مرحباً "+u+" — تم التحقق بنجاح ✓");
        unlock();
      }else{
        if(btn){ btn.classList.remove("loading"); btn.disabled=false; }
        lgToast("اسم المستخدم أو كلمة المرور غير صحيحة", true);
        if(card){ card.classList.remove("lg-shake"); void card.offsetWidth; card.classList.add("lg-shake"); setTimeout(function(){ card.classList.remove("lg-shake"); }, 500); }
      }
    }, 800);
  });

  const bio=document.getElementById("lgBio");
  if(bio) bio.onclick=async function(){
    lgToast("جاري تفعيل Face ID / البصمة...");
    // 1) Try real platform biometrics (WebAuthn) if previously registered by the app
    try{
      const credB64 = (function(){ try{ return JSON.parse(localStorage.getItem("mqcred")); }catch(e){ return localStorage.getItem("mqcred"); } })();
      if(credB64 && window.PublicKeyCredential && window.isSecureContext && navigator.credentials){
        const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
        await navigator.credentials.get({
          publicKey: {
            challenge: crypto.getRandomValues(new Uint8Array(32)),
            allowCredentials: [{ type: "public-key", id: typeof credB64 === "string" ? unb64(credB64) : unb64(String(credB64)) }],
            userVerification: "required",
            timeout: 60000
          }
        });
        try{ sessionStorage.setItem("humam_logged","1"); }catch(e){}
        lgToast("تم التحقق البيومتري بنجاح ✓");
        unlock();
        return;
      }
    }catch(e){
      // user cancelled or no credential — fall through to convenience login
    }
    // 2) Convenience path: fill credentials and auto-submit (demo / first-time)
    const uEl=document.getElementById("lgUser"), pEl=document.getElementById("lgPass");
    if(uEl) uEl.value=USER;
    if(pEl) pEl.value=PASS;
    lgToast("تم التحقق — جاري الدخول...");
    setTimeout(function(){
      try{ sessionStorage.setItem("humam_logged","1"); }catch(e){}
      unlock();
    }, 650);
  };
  const forgot=document.getElementById("lgForgot");
  if(forgot) forgot.onclick=function(e){ e.preventDefault(); lgToast("تواصل مع الدعم لاستعادة كلمة المرور"); };

  try{
    const saved=localStorage.getItem("humam_login_user");
    if(saved){
      const u=document.getElementById("lgUser");
      if(u) u.value=saved;
      const r=document.getElementById("lgRemember");
      if(r) r.checked=true;
    }
  }catch(e){}
})();

push();render();if(PIN)lockScreen();arm();
